[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim4wis"
version = "0.104.0"
description = "4-Wheel Independent Steering Simulator — backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "4WIS Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # The MCP facade (sim4wis_mcp) speaks JSON-RPC over stdio; the backend never
    # imports it. Kept in the main deps so a shipped bundle carries it (the
    # portable packaging vendors it — see docs/agent_interface_design.md §13).
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Parallel run: the suite outgrew serial minutes (S5). Tests are worker-
    # safe by construction — env dirs go through monkeypatch+tmp_path and the
    # only socket user picks an OS port.
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.scripts]
# Bare `sim4wis` still starts the server; subcommands reach the study layer.
sim4wis = "sim4wis.cli:main"
# The agent facade — a separate stdio process, thin HTTP client, no sim4wis import.
sim4wis-mcp = "sim4wis_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
