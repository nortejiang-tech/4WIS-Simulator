name: Portable Windows smoke

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    name: Build and start windows-x64 archive
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Windows portable archive
        run: python scripts/build_portable.py --targets windows-x64

      - name: Verify archive and start embedded application
        run: python scripts/check_portable_package.py --targets windows-x64 --native-smoke
