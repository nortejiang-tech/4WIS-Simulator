name: Native core Windows verification

on:
  workflow_dispatch:
    inputs:
      package_only:
        description: Repackage and test a previously fully verified artifact
        type: boolean
        default: false
      artifact_run_id:
        description: Successful source workflow run (required for package_only)
        type: string
  push:
    branches:
      - codex/native-simulation-core

permissions:
  contents: read
  actions: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SIM4WIS_ENGINE: native
      PYTHONUTF8: "1"
      PW_PYTHON_EXECUTABLE: python
      PW_E2E_PORT: "18051"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ !inputs.package_only }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify native backend
        if: ${{ !inputs.package_only }}
        run: |
          python -m pip install -e "./backend[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_reference_benchmarks.py --report docs/reports/reference_benchmark_review.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest backend/tests -n 4 -q --junitxml=windows-native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test frontend
        if: ${{ !inputs.package_only }}
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run type-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test -- --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright test --reporter=list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeated whole-experiment benchmark
        if: ${{ !cancelled() && !inputs.package_only }}
        run: python scripts/benchmark_native_core.py --repeat 5 --duration 14 --output docs/reports/native_v0.106.0/benchmark-windows.json
      - name: Build wheel and self-contained native archive
        if: ${{ !cancelled() && !inputs.package_only }}
        run: |
          python -m pip wheel ./backend --no-deps -w dist_portable/wheels
          $nativeWheel = (Get-ChildItem dist_portable/wheels/sim4wis-*-cp312-cp312-win_amd64.whl | Select-Object -First 1).FullName
          python scripts/build_portable.py --targets windows-x64 --native-wheel $nativeWheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_portable_package.py --targets windows-x64 --native-smoke --require-native-core --json | Tee-Object -FilePath windows-native-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Out-File -FilePath windows-native-commit.txt
      - name: Download previously verified native artifact
        if: ${{ inputs.package_only }}
        uses: actions/download-artifact@v4
        with:
          name: windows-cpp-core-preview
          path: verified-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify and repackage app-local Windows runtime
        if: ${{ inputs.package_only }}
        run: |
          python -m unittest discover -s scripts/tests -p test_windows_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/repack_native_artifact.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_portable_package.py --targets windows-x64 --native-smoke --require-native-core --json | Tee-Object -FilePath windows-native-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Out-File -FilePath windows-native-commit.txt
      - name: Retain native artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpp-core-preview
          path: |
            dist_portable/4WIS_Simulator_v*_windows-x64.zip
            dist_portable/wheels/*.whl
            docs/reports/native_v0.106.0/benchmark-windows.json
            windows-native-tests.xml
            windows-native-package.log
            windows-native-commit.txt
            frontend/test-results/
          retention-days: 30
