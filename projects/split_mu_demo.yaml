project:
  name: split_mu_demo
  description: "对开路面演示 — 验证 4WIS 在左右 μ 不同时的横摆控制"

vehicle:
  model: simplified_dynamic    # 对开演示必须用动力学模型，运动学模型忽略 μ
  wheelbase: 2.800
  track_front: 1.560
  track_rear: 1.560
  mass: 1800.0
  inertia_z: 2800.0
  cg_to_front: 1.350
  cg_height: 0.55
  tire_radius: 0.330
  steer_limit: 0.6109
  v_max: 20.0
  wheel_inertia: 1.2
  motor_torque_max: 2000.0

suspension:
  caster_angle: 0.0
  kingpin_inclination: 0.0
  camber: 0.0
  scrub_radius: 0.02

controller:
  type: ideal_ackermann
  params: {}

scene:
  surface: flat
  base_mu: 0.9
  disturbances:
    # 一段长 30m / 宽 6m 的对开路面：左侧 0.9，右侧 0.3（湿滑）
    - type: split_mu
      id: split_main
      x: 25.0
      y: 0.0
      width: 6.0
      length: 30.0
      mu_left: 0.9
      mu_right: 0.3
      heading: 0.0
    # 在 60m 处放一块完全冰面
    - type: ice_patch
      id: ice_1
      x: 60.0
      y: 0.0
      width: 8.0
      length: 12.0
      mu: 0.15
      heading: 0.0

recording:
  enabled: true
  channels:
    - vx
    - vy
    - yaw_rate
    - delta_fl
    - delta_fr
    - delta_rl
    - delta_rr
    - icr_vehicle_body_x
    - icr_vehicle_body_y
