# 摩擦的频域分离协议 —— 极低频慢斜坡
#
#   sim4wis study run procedures/friction_slow_ramp.yaml --dry-run
#   sim4wis study run procedures/friction_slow_ramp.yaml
#
# 0.2 Hz 的中心区 weave 里，迟滞环宽对齿条库仑摩擦**不单调**（0 N 时已有
# 0.99 N·m，500 N 时反而降到 0.26）——因为 100 km/h 下车辆自身的侧向动力学
# 滞后贡献了同量级的正交分量，与摩擦项部分抵消。两者都真实存在，但拿这个
# 数写摩擦要求不成立（见 docs/reports/test_report_2026-08-13.md §9-D2）。
#
# ISO 套路本身就是频域分离：把激励频率压到 0.02 Hz，并把车速降到 50 km/h
#（滞后时间常数 τ ∝ V 随之缩小），动力学正交分量消失，迟滞环宽回归单调：
# 实测（本模板工况）0/80/260/900 N 齿条摩擦 → 0.29/0.96/1.12/1.71 N·m。
# 这时环宽才配得上写摩擦要求（steering_feel 的摩擦条目据此升为判定项）。
#
# 三条约定与 iso13674_oncentre.yaml 相同：工况钉死、转向层必须开启、
# 单值 sweep 轴把工况写进结果坐标（freq_hz == 0.02 是目标集匹配它的键）。

study: friction_slow_ramp
question: 极低频斜坡下迟滞环有多宽？摩擦与车辆动力学分量分离后，环宽对齿条摩擦是否单调？

model: simplified_dynamic
targets: steering_feel

baseline:
  name: slow_ramp_50kmh
  strategy: ideal_ackermann
  record_hz: 50
  vehicle:
    overrides:
      steering_system:
        enabled: true
  maneuver:
    steps:
      # 直行放掉起步瞬态。
      - duration: 5.0
        speed_kmh: 50
        steer: {kind: constant, amplitude: 0.0}
      # 3 个周期：丢 1 个，剩 2 个供上下行穿越平均。
      - duration: 150.0
        speed_kmh: 50
        steer: {kind: sine, amplitude: 0.4, unit: front_deg, freq_hz: 0.02}

sweep:
  # 单值轴：工况写进结果坐标。freq_hz == 0.02 正是 steering_feel 摩擦条目
  # 的匹配键——同一指标在 0.2 Hz 的 weave 上不判定。
  speed_kmh:
    values: [50]
    bind: maneuver.steps.1.speed_kmh
  freq_hz:
    values: [0.02]
    bind: maneuver.steps.1.steer.freq_hz

metrics:
  # 迟滞环本身：零转角处与零力矩处的宽度——慢斜坡下即摩擦感本身。
  - onc_torque_hysteresis_nm
  - onc_torque_deadband_deg
  # 实际达到的试验工况。
  - onc_sw_amplitude_deg
  - onc_frequency_hz

criteria:
  # 自检：跑出来的确实是一次慢斜坡（0.02 Hz），而不是 0.2 Hz 的中心区 weave。
  - {metric: onc_frequency_hz, must: "< 0.03", at: all}

report:
  template: sweep
