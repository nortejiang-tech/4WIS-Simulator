# 角度跟随层 —— 负载扰动恢复评估（FR-10 的扰动臂）
#
#   sim4wis study run procedures/tracking_disturbance_response.yaml
#
# 60 km/h 直行 5 s 后前轴阶跃 1.5°（≈0.26 g，干燥路面包线内），车辆在
# 角度稳定后驶入 x≈90 m 的低 μ 冰面（场景扰动，μ 0.85→0.35）——轮胎
# 回正力突变即角执行器的负载阶跃。分析器从齿条力自身检测扰动时刻，
# 量峰值跟踪偏差与回到 ±0.01 rad 的恢复时间。这是 DOB/ADRC 的主场：
# 无观测器的回路靠积分慢慢拉回，带观测器的应当显著更快。

study: tracking_disturbance_response
question: 突遇低 μ 路面（回正力阶跃）时，各控制策略的转角跟踪被扰动多少、多久恢复？

model: simplified_dynamic
targets: null

baseline:
  name: dist_4wis
  strategy: ideal_ackermann
  record_hz: 200
  scene:
    base_mu: 0.85
    disturbances:
      # 一块横向足够宽的冰面，任何残余曲率都会驶入。
      - type: ice_patch
        id: load_step_patch
        x: 90.0
        y: 0.0
        width: 40.0
        length: 6.0
        mu: 0.35
  vehicle:
    overrides:
      steering_system:
        enabled: true
        architecture: 4wis
        angle_control:
          enabled: true
          controller: open_loop
          sensor_quant_rad: 0.00017
          sensor_delay_steps: 1
          # 扰动臂全员只用速度前馈：负载补偿正是被比较的对象——
          # 观测器型（dob/adrc）与积分器型（pid/lqr）靠自身恢复。
          # （rack/friction 前馈与 dob/adrc 互斥，混用会被构造期拒绝。）
          controller_kwargs:
            ff:
              blocks:
                - {type: velocity, damping: 4.0, inertia: 0.6}
  maneuver:
    steps:
      # 直行 5 s：车速伺服到位，x ≈ 83 m。
      - duration: 5.0
        speed_kmh: 60
        steer: {kind: constant, amplitude: 0.0}
      # 1.8° 阶跃（≈0.31 g，贴近冰面容量以强化回正力突变）并在
      # 冰面（x≈90 m，约 0.4 s 后到达）期间保持。
      - duration: 6.0
        speed_kmh: 60
        steer: {kind: step, amplitude: 1.8, unit: front_deg, t_step: 0.0}

sweep:
  controller:
    values: [open_loop, pid_single, pid_cascade, lqr, dob, adrc, smc, mpc, h_inf]
    bind: vehicle.overrides.steering_system.angle_control.controller

metrics:
  - trk_dist_onset_s
  - trk_dist_peak_dev_rad
  - trk_dist_recover_s
  - trk_dist_rack_step_n

criteria:
  # 扰动确实发生了（自检：齿条力阶跃显著）。
  - {metric: trk_dist_rack_step_n, must: "> 100", at: all}
  # 谁被甩出去谁不及格：偏差不得超出架构自身的 0.05 rad 限。
  - {metric: trk_dist_peak_dev_rad, must: "< 0.05", at: all}

report:
  template: sweep
