# 角度跟随层 —— 柔度传动扫频评估（方向 3 的频域臂）
#
#   sim4wis study run procedures/tracking_compliance_sweep.yaml
#
# 与 tracking_sweep_response.yaml 同工况（60 km/h、0.2° 阶梯正弦
# 0.5→1→2→5→10 Hz），差别在被控对象：双质量传动（k=1200 → 17.8 Hz 共振）
# + 柔度调参增益（出处 scripts/devtools/compliance_tuning.py 车辆级阶段）。
# 柔度环带宽被共振压在 ~2–3 Hz，本模板如实给出该配置的频域衰减。
#
# 每个 sweep 单元是一个完整的 angle_control 配置块。前馈栈省略 rack_force
# 低通（柔度环上 15 Hz 低通是失稳元凶，教训 #6 的柔度版）。

study: tracking_compliance_sweep
question: 柔度传动下，柔度调参后的各控制策略的转角跟随带宽与相位滞后是多少？
model: simplified_dynamic
targets: null

baseline:
  name: compliance_sweep_4wis
  strategy: ideal_ackermann
  record_hz: 200
  vehicle:
    overrides:
      steering_system:
        enabled: true
        architecture: 4wis
        angle_control:
          enabled: true
          controller: pid_single
          plant_transmission_stiffness_nms_per_rad: 1200.0
          plant_motor_inertia_fraction: 0.2
          sensor_quant_rad: 0.00017
          sensor_delay_steps: 1
          controller_kwargs:
            kp: 623.772
            ki: 50.720
            kd: 41.716
            deriv_tau_s: 0.056375
            ff:
              blocks:
                - {type: rack_force, gain: 1.0}
                - {type: velocity, damping: 4.0, inertia: 0.6}
                - {type: friction, friction_nm: 0.5}
  maneuver:
    steps:
      - duration: 2.0
        speed_kmh: 60
        steer: {kind: constant, amplitude: 0.0}
      - duration: 8.0
        speed_kmh: 60
        steer: {kind: sine, amplitude: 0.2, unit: front_deg, freq_hz: 0.5}
      - duration: 4.0
        speed_kmh: 60
        steer: {kind: sine, amplitude: 0.2, unit: front_deg, freq_hz: 1.0}
      - duration: 2.0
        speed_kmh: 60
        steer: {kind: sine, amplitude: 0.2, unit: front_deg, freq_hz: 2.0}
      - duration: 0.8
        speed_kmh: 60
        steer: {kind: sine, amplitude: 0.2, unit: front_deg, freq_hz: 5.0}
      - duration: 0.4
        speed_kmh: 60
        steer: {kind: sine, amplitude: 0.2, unit: front_deg, freq_hz: 10.0}
      - duration: 1.0
        speed_kmh: 60
        steer: {kind: constant, amplitude: 0.0}

sweep:
  # 每个单元 = 一个完整的柔度 angle_control 配置（3 个可调 v1 控制器）。
  profile:
    values:
      - controller: pid_single
        enabled: true
        plant_transmission_stiffness_nms_per_rad: 1200.0
        plant_motor_inertia_fraction: 0.2
        sensor_quant_rad: 0.00017
        sensor_delay_steps: 1
        controller_kwargs:
          kp: 623.772
          ki: 50.720
          kd: 41.716
          deriv_tau_s: 0.056375
          ff:
            blocks:
              - {type: rack_force, gain: 1.0}
              - {type: velocity, damping: 4.0, inertia: 0.6}
              - {type: friction, friction_nm: 0.5}
      - controller: pid_cascade
        enabled: true
        plant_transmission_stiffness_nms_per_rad: 1200.0
        plant_motor_inertia_fraction: 0.2
        sensor_quant_rad: 0.00017
        sensor_delay_steps: 1
        controller_kwargs:
          kp_pos: 17.091
          ki_pos: 0.0
          kp_vel: 30.297
          ki_vel: 39.798
          deriv_tau_s: 0.045003
          ff:
            blocks:
              - {type: rack_force, gain: 1.0}
              - {type: velocity, damping: 4.0, inertia: 0.6}
              - {type: friction, friction_nm: 0.5}
      - controller: lqr
        enabled: true
        plant_transmission_stiffness_nms_per_rad: 1200.0
        plant_motor_inertia_fraction: 0.2
        sensor_quant_rad: 0.00017
        sensor_delay_steps: 1
        controller_kwargs:
          q_integral: 92.105
          q_angle: 2859.476
          q_rate: 0.20374
          r: 0.041702
          deriv_tau_s: 0.042555
          ff:
            blocks:
              - {type: rack_force, gain: 1.0}
              - {type: velocity, damping: 4.0, inertia: 0.6}
              - {type: friction, friction_nm: 0.5}
    bind: vehicle.overrides.steering_system.angle_control

metrics:
  - trk_amp_ratio_0_5hz
  - trk_amp_ratio_1hz
  - trk_amp_ratio_2hz
  - trk_amp_ratio_5hz
  - trk_amp_ratio_10hz
  - trk_phase_lag_2hz
  - trk_bw_hz

criteria:
  # 柔度环带宽被共振压住（实测 1.1-5.2 Hz，且 lqr 在 0.5 Hz 有车辆动态
  # 相互作用凹口 0.71）：0.5 Hz 幅值比 > 0.65、1 Hz > 0.7、2 Hz 相位有界
  # ——与刚性臂同一判据族、如实放宽门槛。
  - {metric: trk_amp_ratio_0_5hz, must: "> 0.65", at: all}
  - {metric: trk_amp_ratio_1hz, must: "> 0.7", at: all}
  - {metric: trk_phase_lag_2hz, must: "< 60", at: all}

report:
  template: sweep
